id: workflows
title: Community workflows
tabs:
- id: best_practices
  title: Workflow Best Practices
  heading_md: A workflow is a series of Galaxy tools that have been linked 
    together to perform a specific analysis. The above tabs contain both peer 
    reviewed and community submitted workflows. You can use and customize the 
    example workflows found there.
  content:
  - title_md: Creating a new workflow
    description_md: You can create a Galaxy workflow from scratch in the Galaxy 
      workflow editor.
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_create_new.html
  - title_md: Running a workflow
    description_md: Once you have a workflow, you can run it on data on your 
      history.
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_run.html
  - title_md: Extracting a workflow from your history
    description_md: A workflow can be shared publicly
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_publish.html
  - title_md: Make a workflow public
    description_md: You can create a Galaxy workflow from scratch in the Galaxy 
      workflow editor.
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_create_new.html
  - title_md: Annotate and Tag a workflow
    description_md: To find a workflow, you can annotate it
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_annotate.html
  - title_md: Ensuring Workflows meet Best Practices
    description_md: When you are editing a workflow, there are a number of 
      additional steps you can take to ensure that it is a Best Practice 
      workflow and will be more reusable.
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_best_practices.html
- id: iwc
  title: Peer-reviewed & FAIR workflows
  heading_md: "The following workflows are state of the art workflows that have been\n\
    \ reviewed and are maintained by scientists.They are hosted on [WorkflowHub](https://workflowhub.eu/search?q=edna+galaxy)\n\
    \ and maintained by [Intergalactic Workflow Commission (IWC)](https://github.com/galaxyproject/iwc/)."
  content:
  - title_md: Import workflows from WorkflowHub
    description_md: WorkflowHub is a workflow management system which allows 
      workflows to be FAIR (Findable, Accessible, Interoperable, and Reusable), 
      citable, have managed metadata profiles, and be openly available for 
      review and analytics.
    button_tip: Read Tips
    button_icon: tutorial
    button_link: 
      https://training.galaxyproject.org/training-material/faqs/galaxy/workflows_import.html
  - title_md: Quality and Contamination control workflow for paired-end data
    description_md: Workflow covering operations related to Expression 
      analysis,Statistical calculation,Sequence contamination 
      filtering,Sequencing quality control,Data parsing,Taxonomic 
      classification,Cross-assembly
    button_link: '{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=1052'
    button_tip: View workflow
    button_icon: view
  - title_md: Dada2: amplicon analysis for paired-end data
    description_md: Workflow covering operations related to Variant calling,DNA 
      barcoding
    button_link: '{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=790'
    button_tip: View workflow
    button_icon: view
  - title_md: Taxonomy Assignment with QIIME2
    description_md: Workflow covering operations related to 
      Visualisation,Demultiplexing,Taxonomic classification,Formattingon topics 
      related to Taxonomy
    button_link: '{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=2098'
    button_tip: View workflow
    button_icon: view
  - title_md: Building an amplicon sequence variant (ASV) table from 16S data 
      using DADA2
    description_md: Workflow covering operations related to 
      Visualisation,Variant calling,DNA barcoding,Analysis,Deposition
    button_link: '{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=1395'
    button_tip: View workflow
    button_icon: view
  - title_md: Taxonomic Analysis of eDNA
    description_md: Workflow covering operations related to Sequence 
      contamination filtering,Sequencing quality control
    button_link: '{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=1723'
    button_tip: View workflow
    button_icon: view
