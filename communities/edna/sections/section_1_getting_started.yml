id: data
title: Getting started
tabs:
  - id: help
    title: Overview
    heading_md: See the questions below to get started and find your way around the Galaxy platform.
    content:
      - title_md: How can I find my way around Galaxy?
        description_md: >
          The Galaxy homepage is divided into four sections (panels) as labelled in the image below:  

          
          The **Activity Bar** is where you can toggle the view to navigate to the resources in Galaxy (Tools, Workflows, Histories etc.). At the top of the Activity Bar you can find the 'upload' button to move your data into Galaxy. 

          
          The **Tools** panel allows you to search for any of the 2000+ tools available in the Galaxy interface. By default, the Tools activity will be active and its panel will be expanded.  

          
          The **Centre** panel in the middle is the main area where tools and data analysis can be viewed.  

          
          The **History** panel on the right shows the files (uploaded and generated) from your analysis and will display your “current” history.  

          
          To get started you can register or log in to the Galaxy interface (1). You can find other labs (focused research interfaces), training and support specific to Galaxy (2). 
          <img class="img-fluid" src="./static/edna_interface_FINAL.png" alt="Galaxy Interface">
      - title_md: How can I use Galaxy?
        description_md: >
          Galaxy lets you analyse your data in a web browser, with no coding. Pick a tool from the sections in the **Tools** panel or search via the search bar and run it on your data. Most analyses chain several tools together, with each result feeding the next. Every result is saved automatically to your **History** on the right, so you can inspect it, download it, or branch off and try 
          another approach. Nothing is overwritten. Once you're happy with a sequence of steps, save it as a **Workflow**. You can re-run the same analysis in one click, and
          you can share it with colleagues to run on their own data. You can find **Tutorials** to navigate Galaxy and learn new techniques via the Galaxy Training Network (see small graduation hat logo in the top right). Some selected Tutorials can be accessed via the tab above.
          <img class="img-fluid" src="./static/edna_workflow_FINAL.png" alt="Galaxy Interface">
      - title_md: How can I upload my data to Galaxy?
        description_md: >
          You can upload your data to Galaxy using the Upload tool from anywhere in Galaxy. Just look for the "Upload data" button at the top of the tool panel. You can upload data to Galaxy from your computer or from the web.
        buttons:
          - icon: run
            link: "{{ galaxy_base_url }}/tool_runner?tool_id=upload1"
            tip: Upload data
      - title_md: How can I subsample my data?
        description_md: >
          You can subsample large datasets to test tools and workflows. A useful
          tool is <code>seqtk_seq</code>, setting the parameter at "Sample fraction of sequences".    
      - title_md: Can I upload sensitive data?
        description_md: >
          No, do not upload personal or sensitive data, such as human health or clinical data.
          Please see our <a href="{{ data_privacy_url }}">Data Privacy</a> page for definitions of sensitive and
          health-related information. Please also make sure you have read our
          <a href="{{ terms_of_service_url }}">Terms of Service</a>, which covers hosting and analysis of research data.
      - title_md: Is my data private?
        description_md: >
          Please read our <a href="{{ data_privacy_url }}">Privacy Policy</a> for information on your personal data
          and any data that you upload.
      - title_md: How can I increase my storage quota?
        description_md: >
          Please submit a quota request if your Galaxy {{ site_name }} account reaches its data storage limit.
          Requests are usually provisioned quickly if you provide a reasonable use case for your request.
        buttons:
          - icon: help
            link: "{{ quota_request_url }}"
            tip: Request a quota increase
            
  - id: tutorials
    title: Tutorials
    heading_md: >
      Tutorials are available in the Galaxy Training Network (accessible via the graduation hat logo in the top right) and cover a wide range of topics from using Galaxy to domain-specific methods and techniques. Here are a few selected tutorials to help you get started.
    content:
      - title_md: A Short Introduction to Galaxy
        description_md: >
         Learn how to navigate Galaxy and perform basic steps in the Galaxy platform.
        buttons:
          - icon: tutorial
            link: "https://training.galaxyproject.org/training-material/topics/introduction/tutorials/galaxy-intro-short/tutorial.html"
            tip: View GTN topic
      - title_md: Using Galaxy and Managing your Data
        description_md: >
         Learn how to upload and manage data in the Galaxy platform.
        buttons:
          - icon: tutorial
            link: "https://training.galaxyproject.org/training-material/topics/galaxy-interface/"
            tip: View GTN topic
      - title_md: Quality Control
        description_md: >
          Learn about quality control of sequencing reads. Quality control and data cleaning are essential first steps in any next-generation sequencing analysis. This tutorial
          shows how to use and interpret results from <code>FastQC</code>, <code>NanoPlot</code> and <code>PycoQC</code>.
        buttons:
          - icon: tutorial
            link: "https://training.galaxyproject.org/training-material/topics/sequence-analysis/tutorials/quality-control/tutorial.html"
            tip: View GTN tutorial
      - title_md: Introduction to Genomics and Galaxy
        description_md: >
          Learn how to navigate the Galaxy platform with genomics and genetic datasets in mind.
        buttons:
          - icon: tutorial
            link: "https://training.galaxyproject.org/training-material/topics/introduction/tutorials/galaxy-intro-strands/tutorial.html"
            tip: View GTN tutorial
      - title_md: Galaxy {{ site_name }} support
        description_md: >
          Any user of Galaxy {{ site_name }} can request support through an online form.
        buttons:
          - icon: help
            link: "{{ support_url }}"
            tip: Request support from Galaxy {{ site_name }}
